services:
  - type: web
    name: inkwand
    runtime: python
    # free sleeps after ~15 min idle (first visit then takes ~1 min to wake).
    # Switch to "starter" to keep it always on.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      # Set this one in the Render dashboard. It is never stored in the repo.
      - key: GEMINI_API_KEY
        sync: false
