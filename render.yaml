services:
  - type: web
    name: inkwand
    runtime: python
    # starter stays awake. "free" also works, but sleeps after ~15 min idle
    # and the first visit then takes about a minute to wake it.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      # Set this one in the Render dashboard. It is never stored in the repo.
      - key: GEMINI_API_KEY
        sync: false
